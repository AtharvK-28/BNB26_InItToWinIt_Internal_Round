services:
  - type: web
    name: creatorai-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: ./services/api
    healthCheckPath: /health
    envVars:
      - key: ENABLE_DEMO_WORKER
        value: "true"
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_MODE
        value: cloud
      - key: STORAGE_BACKEND
        value: supabase
      - key: STORAGE_BUCKET
        value: creatorai-media
      - key: MAX_UPLOAD_MB
        value: "40"
      - key: MAX_CLIP_SECONDS
        value: "180"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: MEDIA_SIGNING_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
