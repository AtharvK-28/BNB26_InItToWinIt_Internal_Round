name: Prototype checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm build && pnpm typecheck
      - run: python docs/tools/setup_design_skills.py
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: creatorai
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: creatorai_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - working-directory: services/api
        run: uv sync --frozen
      - working-directory: services/api
        run: uv run --no-sync ruff check creatorai migrations tests
      - working-directory: services/api
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://creatorai:test-only-password@localhost:5432/creatorai_test
        run: uv run --no-sync pytest -q
      - working-directory: services/api
        run: uv export --frozen --no-dev --no-hashes --format requirements-txt --no-header | diff - <(tail -n +3 requirements.txt)
        shell: bash
